<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CUI Sports</title>
    <!-- Bootstrap 5.3.3 is used for the login and admin pages. A copy is kept in css/vendor and js/vendor
         so the pages also work without internet (the same files as the jsDelivr CDN). -->
    <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <main class="d-flex align-items-center justify-content-center p-3">
        <section class="card shadow-lg border-0 w-100" style="max-width: 420px;">
            <div class="card-body p-4 p-md-5">
                <a href="index.html" class="text-decoration-none small">&larr; Back to website</a>
                <h1 class="h3 fw-bold mt-3 mb-1">Staff login</h1>
                <p class="text-secondary mb-4">For the sports office and department sports coordinators.</p>

                <div id="loginMessage" class="alert alert-danger d-none" role="alert"></div>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-control" autocomplete="username" maxlength="30">
                        <p class="error-text" data-error-for="username"></p>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" maxlength="50">
                            <button type="button" id="togglePassword" class="btn btn-outline-secondary" aria-label="Show password">Show</button>
                        </div>
                        <p class="error-text" data-error-for="password"></p>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Log in</button>
                </form>

                <div class="small text-secondary mt-4 border rounded p-3 bg-light">
                    <p class="fw-semibold mb-1">Demo accounts for the viva</p>
                    <p class="mb-1">Admin: <strong>admin</strong> / <strong>Admin@123</strong></p>
                    <p class="mb-1">CS faculty coordinator: <strong>cs.faculty</strong> / <strong>Coord@123</strong></p>
                    <p class="mb-0">CS male student coordinator: <strong>cs.student.m</strong> / <strong>Coord@123</strong></p>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="js/login.js"></script>
</body>
</html>
